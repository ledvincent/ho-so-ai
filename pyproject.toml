[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ho-so-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.scripts]
hoso-fetch = "hoso_ai.fetch:main"

[tool.setuptools.packages.find]
where = ["src"]
