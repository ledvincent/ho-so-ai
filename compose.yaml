services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hoso
      POSTGRES_PASSWORD: hoso_local
      POSTGRES_DB: hoso
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - hoso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoso -d hoso"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  hoso_pgdata:
