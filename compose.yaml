services:
  embeddings:
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - hoso_models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: 1
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hoso
      POSTGRES_PASSWORD: hoso_local
      POSTGRES_DB: hoso
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - hoso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoso -d hoso"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  hoso_pgdata:
  hoso_models:
